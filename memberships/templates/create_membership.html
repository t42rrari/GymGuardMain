{% extends 'base.html' %}

{% block title %}Create Membership | GymGuard{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Create Membership</h1>
    <p>Create a membership and optionally assign a trainer.</p>
</section>

{% if error %}
    <div class="alert error">{{ error }}</div>
{% endif %}

<form method="POST" class="content-form">
    {% csrf_token %}

    <label for="member">Member</label>
    <select id="member" name="member" required>
        <option value="">Choose a member</option>
        {% for member in members %}
            <option value="{{ member.id }}">{{ member.username }}</option>
        {% endfor %}
    </select>

    <label for="trainer">Assign Trainer</label>
    <select id="trainer" name="trainer">
        <option value="">No trainer assigned</option>
        {% for trainer in trainers %}
            <option value="{{ trainer.id }}">{{ trainer.username }}</option>
        {% endfor %}
    </select>

    <label for="plan">Membership Plan</label>
    <input id="plan" type="text" name="plan" maxlength="30" required>

    <label for="start_date">Start Date</label>
    <input id="start_date" type="date" name="start_date" required>

    <label for="end_date">End Date</label>
    <input id="end_date" type="date" name="end_date" required>

    <button class="button" type="submit">Create Membership</button>
    <a class="button secondary" href="{% url 'view_membership' %}">Cancel</a>
</form>
{% endblock %}
