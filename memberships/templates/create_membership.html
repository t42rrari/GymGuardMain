<!DOCTYPE html>
<html>
<head>
    <title>Create Membership</title>
</head>
<body>
    <h1>Create Membership</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>First Name: <input type="text" name="first_name" required></p>

        <p>Last Name: <input type="text" name="last_name" required></p>

        <p>Email: <input type="email" name="email" required></p>

        <p>Password: <input type="password" name="password" required></p>

        <p>Membership Plan: <input type="text" name="plan" maxlength="30" required></p>

        <p>Start Date: <input type="date" name="start_date" required></p>

        <p>End Date: <input type="date" name="end_date" required></p>

        <button type="submit">Create Membership</button>
    </form>

    <br>
    <a href="{% url 'view_membership' %}">Back to Memberships</a>
</body>
</html>
