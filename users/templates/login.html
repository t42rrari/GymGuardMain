<!DOCTYPE html>
<html>
<head>
    <title>GymGuard Login</title>
</head>
<body>
    <h2>GymGuard Login</h2>
    <form method="POST">
        {% csrf_token %}
        <p>Username:</p>
        <input type="text" name="username" required>
        <p>Password:</p>
        <input type="password" name="password" required>
        <br><br>
        <button type="submit">Login</button>
    </form>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

</body>
</html>
