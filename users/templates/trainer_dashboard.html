{% extends 'base.html' %}

{% block title %}Trainer Dashboard | GymGuard{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Welcome, {{ request.user.username }}</h1>
    <p>View the members assigned to you.</p>
</section>

<div class="dashboard-grid">
    <div class="dashboard-card">
        <h3>Assigned Members</h3>
        <p>View members currently assigned to your trainer account.</p>
        <a class="button" href="{% url 'view_membership' %}">View Assigned Members</a>
    </div>
</div>
{% endblock %}
